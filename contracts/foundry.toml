[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[rpc_endpoints]
hsk_testnet = "https://testnet.hsk.xyz"
hsk_mainnet = "https://mainnet.hsk.xyz"

[etherscan]
hsk_testnet = { key = "blockscout", url = "https://testnet-explorer.hskchain.net/api/", chain = 133 }

[lint]
lint_on_build = false
